name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    # Doc-only commits don't change the built app — don't redeploy Pages for them.
    # test.yml still runs on every push to main (no path filter there), so the
    # engine gate is never skipped. workflow_dispatch remains for manual deploys.
    paths-ignore:
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # The engine regression gate: a red suite must never deploy. Reuses the SAME
  # workflow as PR/push testing via workflow_call — one definition, no drift
  # (previously a copy-pasted job; governance sprint 2026-07-09, TD-10).
  test:
    uses: ./.github/workflows/test.yml

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_FITBIT_CLIENT_ID: ${{ secrets.VITE_FITBIT_CLIENT_ID }}
          VITE_FITBIT_OAUTH_URL: ${{ secrets.VITE_FITBIT_OAUTH_URL }}
          VITE_STRAVA_CLIENT_ID: ${{ secrets.VITE_STRAVA_CLIENT_ID }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./apps/mobile/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
