name: Tests

# The engine regression gate: run the full node test suite (incl. the golden-master
# snapshot) on every push to main and every PR into main. Previously `npm test` pointed
# at a non-existent file and never ran, so drift went uncaught (see the golden-master
# re-baseline in this change). This job is the safety net every later engine change relies on.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Reusable: deploy.yml calls this same suite as its gate instead of carrying a
  # copy-pasted job that could drift (governance sprint 2026-07-09, TD-10).
  workflow_call:

jobs:
  engine-suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      # Correctness lint + the engine-purity ruleset (Art 18 at edit time) — errors
      # fail the gate; warnings don't (the floor is signal, not ceremony).
      - run: npm run lint
      - run: npm test
      # The engine-owned suite (Phase 3 M0 T1 — packages/engine/tests/*.test.mjs),
      # exercisable without booting the app (TR-11). A separate, unconditional step
      # (no continue-on-error, no if:) so it can't be silently skipped — a missing
      # or empty suite fails run-engine.mjs itself, and a red test fails this step.
      - run: npm run test:engine
