<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!--
    Browser-tab favicon for the website + coach dashboard. Next.js App Router
    serves app/icon.svg automatically. Same readiness "traffic light" as the
    mobile app icon, so every surface shows one mark.
  -->
  <defs>
    <radialGradient id="glow" cx="72%" cy="18%" r="62%">
      <stop offset="0%" stop-color="#6fd3c4" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#6fd3c4" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="114" fill="#0d1016"/>
  <rect width="512" height="512" rx="114" fill="url(#glow)"/>
  <rect x="178" y="72" width="156" height="368" rx="78" fill="#161b24"
        stroke="#ffffff" stroke-opacity="0.08" stroke-width="2"/>
  <circle cx="256" cy="148" r="40" fill="#46c98b"/>
  <circle cx="256" cy="256" r="40" fill="#f2c14e"/>
  <circle cx="256" cy="364" r="40" fill="#e8836f"/>
</svg>
